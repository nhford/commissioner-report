name: Scrape

on:
  schedule:
    # GitHub cron is UTC-only. These are fixed UTC-5 (EST).
    # Tuesday 3:30am: weeks, trades, records, ranks.
    - cron: "30 8 * 8-12,1 2"
    # Daily 12:00pm: projections and recent activity.
    - cron: "0 17 * 8-12,1 *"
    # Median Watch: Wed–Mon 8:00pm, plus Sun/Thu 11:30pm.
    - cron: "0 1 * 8-12,1 0,1,2,4,5,6"
    - cron: "30 4 * 8-12,1 1,5"
  workflow_dispatch:
    inputs:
      group:
        description: Which scrape to run
        type: choice
        options:
          - tuesday
          - daily
          - median
          - logos
          - grid
          - backfill
        default: tuesday
      grids_only:
        description: Immaculate Grid only inserts missing days
        type: boolean
        default: false

concurrency:
  group: scrape-${{ github.event.inputs.group || github.event.schedule }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
      ESPN_SEASON_ID: ${{ vars.ESPN_SEASON_ID }}
      SUPABASE_URL: https://jdfdpbgqiigkjatzudle.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VERCEL_REVALIDATE_URL: ${{ vars.VERCEL_REVALIDATE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run the scrape group
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 8 * 8-12,1 2") GROUP=tuesday ;;
              "0 17 * 8-12,1 *") GROUP=daily ;;
              *) GROUP=median ;;
            esac
          else
            GROUP="${{ github.event.inputs.group }}"
          fi
          echo "Scrape group: $GROUP"
          case "$GROUP" in
            tuesday)
              # Weeks and waiver bids, then trades, then records, then ranks.
              # Records still walk ESPN. The week rollup stays off this job until
              # `python scrapers/player_records.py --diff` reports no mismatches.
              # Intermediate steps skip revalidate. Ranks pings once at the end.
              SCRAPE_REVALIDATE=0 python scrapers/superlatives.py --ingest-only
              SCRAPE_REVALIDATE=0 python scrapers/trades.py
              SCRAPE_REVALIDATE=0 python scrapers/player_records.py
              python scrapers/superlatives.py --ranks-only
              ;;
            daily)
              python scrapers/player_projections.py
              python scrapers/recent_activity.py
              python -c "import sys; sys.path.insert(0, 'scrapers'); from revalidate import ping_revalidate; ping_revalidate()"
              ;;
            median)
              python scrapers/median_monday.py
              ;;
            logos)
              python scrapers/fantasy_logos.py
              ;;
            grid)
              if [ "${{ github.event.inputs.grids_only }}" = "true" ]; then
                python scrapers/immaculate_grid.py --grids-only
              else
                python scrapers/immaculate_grid.py
              fi
              ;;
            backfill)
              SCRAPE_REVALIDATE=0 python scrapers/superlatives.py --full --ingest-only
              SCRAPE_REVALIDATE=0 python scrapers/trades.py
              SCRAPE_REVALIDATE=0 python scrapers/player_records.py --full
              python scrapers/superlatives.py --ranks-only
              ;;
            *)
              echo "Unknown group: $GROUP" >&2
              exit 1
              ;;
          esac
