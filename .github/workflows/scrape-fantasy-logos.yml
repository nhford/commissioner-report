name: Scrape Fantasy Logos

on:
  workflow_dispatch:

concurrency:
  group: scrape-fantasy-logos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
      ESPN_SEASON_ID: ${{ vars.ESPN_SEASON_ID }}
      SUPABASE_URL: https://jdfdpbgqiigkjatzudle.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run fantasy logos
        run: python scrapers/fantasy_logos.py
